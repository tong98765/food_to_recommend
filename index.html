<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HW 飲食地圖 - 18區美食指南</title>

    <!-- ===== Leaflet CSS & JS ===== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        /* ============================================================
           全域樣式 (完整保留，僅修改相關文字)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F5F6F8;
            color: #1A1A1A;
            height: 100vh;
            overflow: hidden;
        }

        .app-header {
            height: 56px;
            background: #FFFFFF;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 30;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: -0.3px;
            cursor: pointer;
            user-select: none;
        }
        .app-header .logo span {
            color: #007DFF;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #F0F2F5;
            color: #1A1A1A;
        }
        .btn:hover {
            background: #E5E8EC;
        }
        .btn-primary {
            background: #007DFF;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0066CC;
        }
        .btn-warning {
            background: #FFC107 !important;
            color: #fff !important;
        }
        .btn-warning:hover {
            background: #E6A800 !important;
        }
        .btn-success {
            background: #2ED573;
            color: #fff;
        }
        .btn-success:hover {
            background: #26B861;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-edit {
            background: #FFB800;
            color: #fff;
            padding: 2px 10px;
            font-size: 11px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        .btn-edit:hover {
            background: #E6A500;
        }

        /* ---------- 主佈局 ---------- */
        .app-body {
            display: flex;
            height: calc(100vh - 56px);
            position: relative;
            transition: all 0.3s ease;
        }

        /* ---------- 側邊欄 (桌面) ---------- */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: #FFFFFF;
            border-right: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 20;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.04);
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 12px 0;
        }
        .sidebar-section {
            padding: 14px 18px 10px;
            border-bottom: 1px solid #F1F3F5;
        }
        .sidebar-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: #8A9AA8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }
        .district-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-height: 126px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .district-tag {
            padding: 7px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            border-radius: 10px;
            background: #F5F6F8;
            color: #4A5A6A;
            cursor: pointer;
            transition: all 0.2s;
            border: 1.5px solid transparent;
            user-select: none;
            line-height: 1.3;
        }
        .district-tag:hover {
            background: #EDF2FA;
            color: #007DFF;
            border-color: rgba(0, 125, 255, 0.2);
        }
        .district-tag.active {
            background: #007DFF;
            color: #fff;
            border-color: #007DFF;
            box-shadow: 0 2px 8px rgba(0, 125, 255, 0.25);
        }
        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .filter-tag {
            padding: 6px 0;
            text-align: center;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: all 0.2s;
            background: #F5F6F8;
            color: #4A5A6A;
            line-height: 1.4;
        }
        .filter-tag:hover {
            transform: scale(1.02);
            background: #EDF2FA;
        }
        .filter-tag.active {
            border-color: #007DFF;
            background: #EEF4FE;
            color: #007DFF;
            box-shadow: 0 2px 6px rgba(0, 125, 255, 0.10);
        }
        .filter-tag.high {
            color: #FF4757;
        }
        .filter-tag.high.active {
            background: #FFEEF0;
            border-color: #FF4757;
            color: #FF4757;
        }
        .filter-tag.medium {
            color: #FFA502;
        }
        .filter-tag.medium.active {
            background: #FFF5E6;
            border-color: #FFA502;
            color: #FFA502;
        }
        .filter-tag.low {
            color: #2ED573;
        }
        .filter-tag.low.active {
            background: #E8F9EF;
            border-color: #2ED573;
            color: #2ED573;
        }
        .filter-tag.star {
            color: #FFB800;
        }
        .filter-tag.star.active {
            background: #FFF8E1;
            border-color: #FFB800;
            color: #FFB800;
        }
        .filter-tag.business {
            color: #6C5CE7;
        }
        .filter-tag.business.active {
            background: #EDE7F6;
            border-color: #6C5CE7;
            color: #6C5CE7;
        }

        /* 品類下拉選單 */
        .cuisine-select-wrapper {
            margin-top: 4px;
        }
        .cuisine-select-wrapper select {
            width: 100%;
            padding: 6px 10px;
            border: 1.5px solid #D0D7DE;
            border-radius: 20px;
            background: #F5F6F8;
            font-size: 13px;
            font-weight: 500;
            color: #4A5A6A;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            appearance: auto;
        }
        .cuisine-select-wrapper select:focus {
            border-color: #007DFF;
            background: #EEF4FE;
        }

        /* 推廣時段下拉 */
        .period-select-wrapper {
            margin-top: 4px;
        }
        .period-select-wrapper select {
            width: 100%;
            padding: 6px 10px;
            border: 1.5px solid #D0D7DE;
            border-radius: 20px;
            background: #F5F6F8;
            font-size: 13px;
            font-weight: 500;
            color: #4A5A6A;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            appearance: auto;
        }
        .period-select-wrapper select:focus {
            border-color: #007DFF;
            background: #EEF4FE;
        }

        .restaurant-list {
            flex: 0 0 28%;
            overflow-y: auto;
            padding: 10px 16px 14px;
            border-top: 1px solid #F1F3F5;
            background: #FAFBFC;
            min-height: 120px;
        }
        .restaurant-card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #F1F3F5;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .restaurant-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }
        .restaurant-card .name {
            font-size: 14px;
            font-weight: 600;
            color: #1A1A1A;
            letter-spacing: -0.2px;
        }
        .restaurant-card .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            font-size: 12px;
            color: #6B7A8A;
            flex-wrap: wrap;
        }
        .restaurant-card .price-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .price-badge.high {
            background: #FFE8EA;
            color: #FF4757;
        }
        .price-badge.medium {
            background: #FFF3E0;
            color: #FFA502;
        }
        .price-badge.low {
            background: #E8F9EF;
            color: #2ED573;
        }
        .restaurant-card .stars {
            color: #FFB800;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .restaurant-card .district-label {
            font-size: 10px;
            color: #8A9AA8;
            background: #F0F2F5;
            padding: 1px 8px;
            border-radius: 12px;
        }
        .restaurant-card .comment-preview {
            font-size: 12px;
            color: #6B7A8A;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .restaurant-card .cuisine-type {
            font-size: 10px;
            color: #8A9AA8;
            background: #F0F2F5;
            padding: 1px 8px;
            border-radius: 12px;
        }
        .restaurant-card .recommender {
            font-size: 11px;
            color: #8A9AA8;
            margin-top: 2px;
        }
        .restaurant-card .business-tags {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            font-size: 12px;
            color: #4A5A6A;
            flex-wrap: wrap;
        }
        .restaurant-card .business-tags span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .restaurant-card .business-tags .yes {
            color: #2ED573;
        }
        .restaurant-card .business-tags .no {
            color: #D0D7DE;
        }
        .restaurant-card .period-tags {
            display: flex;
            gap: 6px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .restaurant-card .period-tags span {
            background: #E8ECF0;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #4A5A6A;
        }
        .restaurant-card .card-actions {
            margin-top: 6px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            border-top: 1px solid #F1F3F5;
            padding-top: 6px;
        }

        /* ---------- 地圖 ---------- */
        .map-container {
            flex: 1;
            position: relative;
            background: #E8ECF0;
            transition: all 0.4s ease;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            transition: height 0.4s ease;
        }

        .toggle-map-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 600;
            background: #FFFFFF;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            font-size: 20px;
            color: #4A5A6A;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .toggle-map-btn:hover {
            background: #F0F7FF;
            transform: scale(1.05);
        }
        .toggle-map-btn:active {
            transform: scale(0.95);
        }

        .locate-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 500;
            background: #FFFFFF;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
            font-size: 20px;
            color: #007DFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .locate-btn:hover {
            transform: scale(1.05);
            background: #F0F7FF;
        }
        .locate-btn:active {
            transform: scale(0.95);
        }
        .locate-btn.loading {
            animation: pulse 1.2s ease-in-out infinite;
            color: #FFA502;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 165, 2, 0.3);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 165, 2, 0);
            }
        }
        .locate-status {
            position: absolute;
            bottom: 90px;
            right: 20px;
            z-index: 500;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .locate-status.show {
            opacity: 1;
        }
        .locate-status.error {
            background: rgba(255, 71, 87, 0.9);
        }
        .locate-status.success {
            background: rgba(46, 213, 115, 0.9);
        }

        /* ---------- Leaflet 彈窗 ---------- */
        .leaflet-popup-content {
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
        }
        .leaflet-popup-content .iw-name {
            font-size: 17px;
            font-weight: 700;
            color: #1A1A1A;
        }
        .leaflet-popup-content .iw-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
            font-size: 13px;
            color: #6B7A8A;
        }
        .leaflet-popup-content .iw-stars {
            color: #FFB800;
        }
        .leaflet-popup-content .iw-address {
            font-size: 13px;
            color: #6B7A8A;
            margin: 2px 0;
        }
        .leaflet-popup-content .iw-comment {
            font-size: 13px;
            color: #4A5A6A;
            background: #F5F6F8;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .leaflet-popup-content .iw-recommender {
            font-size: 12px;
            color: #8A9AA8;
            margin-top: 2px;
        }
        .leaflet-popup-content .iw-business {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 12px;
            color: #4A5A6A;
            flex-wrap: wrap;
        }
        .leaflet-popup-content .iw-business span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .leaflet-popup-content .iw-business .yes {
            color: #2ED573;
        }
        .leaflet-popup-content .iw-business .no {
            color: #D0D7DE;
        }
        .leaflet-popup-content .iw-periods {
            margin-top: 4px;
            font-size: 12px;
            color: #4A5A6A;
        }
        .leaflet-popup-content .iw-periods span {
            background: #E8ECF0;
            padding: 0 8px;
            border-radius: 12px;
            margin-right: 4px;
        }
        .leaflet-popup-content .price-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .leaflet-popup-content .price-badge.high {
            background: #FFE8EA;
            color: #FF4757;
        }
        .leaflet-popup-content .price-badge.medium {
            background: #FFF3E0;
            color: #FFA502;
        }
        .leaflet-popup-content .price-badge.low {
            background: #E8F9EF;
            color: #2ED573;
        }

        .iw-comments {
            margin-top: 12px;
            border-top: 1px solid #E8ECF0;
            padding-top: 10px;
        }
        .iw-comments .comment-item {
            background: #F8F9FA;
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 13px;
            border-left: 3px solid #007DFF;
        }
        .iw-comments .comment-item .comment-text {
            color: #1A1A1A;
        }
        .iw-comments .comment-item .comment-meta {
            font-size: 11px;
            color: #8A9AA8;
            margin-top: 2px;
        }
        .iw-comments .comment-item .comment-meta .rec {
            background: #E8ECF0;
            padding: 0 6px;
            border-radius: 4px;
        }
        .iw-comment-form {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #D0D7DE;
        }
        .iw-comment-form textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #D0D7DE;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 50px;
        }
        .iw-comment-form input[type="text"],
        .iw-comment-form input[type="password"] {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #D0D7DE;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 4px;
        }
        .iw-comment-form .form-row {
            display: flex;
            gap: 6px;
        }
        .iw-comment-form .form-row input {
            flex: 1;
        }
        .iw-comment-form .btn-submit {
            background: #007DFF;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .iw-comment-form .btn-submit:hover {
            background: #0066CC;
        }
        .iw-comment-form .comment-error {
            color: #FF4757;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .iw-comment-form .comment-success {
            color: #2ED573;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        /* ---------- 模態框 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 24px 32px;
            max-width: 520px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1A1A1A;
        }
        .modal .form-group {
            margin-bottom: 12px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4A5A6A;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
            background: #FAFBFC;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: #007DFF;
            box-shadow: 0 0 0 3px rgba(0, 125, 255, 0.12);
            background: #FFFFFF;
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
        }
        .modal .form-row .form-group {
            flex: 1;
        }
        .modal .business-checkbox-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 4px;
        }
        .modal .business-checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 400;
            color: #1A1A1A;
            cursor: pointer;
        }
        .modal .business-checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #007DFF;
            cursor: pointer;
        }
        .modal .period-checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 4px;
        }
        .modal .period-checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 400;
            color: #1A1A1A;
            cursor: pointer;
        }
        .modal .period-checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #007DFF;
            cursor: pointer;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #F1F3F5;
        }
        .modal .error-msg {
            color: #FF4757;
            font-size: 13px;
            margin-top: -6px;
            margin-bottom: 6px;
            display: none;
        }
        .modal .error-msg.show {
            display: block;
        }
        .modal .hidden-field {
            display: none;
        }
        .modal .geocode-status {
            font-size: 12px;

            if (!string) return true;

                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function isValidPhone(string) {
            if (!string) return true;

        // =============================================================
        // 6. 資料操作 (Firestore)
        // =============================================================

        async function loadRestaurants() {
            try {
                const q = query(collection(db, RESTAURANTS_COLLECTION), orderBy('name'));
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    await seedDefaultData();
                    return loadRestaurants();
                }
                const data = [];
                snapshot.forEach(doc => {
                    const raw = doc.data();
                    if (raw.rating > 3) raw.rating = convertRating(raw.rating);
                    if (!raw.hasOwnProperty('recommender')) raw.recommender = '';
                    if (!raw.hasOwnProperty('comments') || !Array.isArray(raw.comments)) raw.comments = [];
                    if (!raw.hasOwnProperty('business')) raw.business = { environment: false, noise: false,
                        few_people: false, private_room: false };
                    if (!raw.hasOwnProperty('promotionPeriods') || !Array.isArray(raw.promotionPeriods)) raw
                        .promotionPeriods = [];
                    data.push(raw);
                });
                localStorage.setItem('hk_restaurants', JSON.stringify(data));
                return data;
            } catch (error) {
                console.error('讀取 Firebase 失敗:', error);
                const cached = localStorage.getItem('hk_restaurants');
                if (cached) { try { return JSON.parse(cached); } catch (e) {} }
                return DEFAULT_RESTAURANTS;
            }
        }

        async function saveRestaurants(data) {
            try {
                const snapshot = await getDocs(collection(db, RESTAURANTS_COLLECTION));
                const batch = writeBatch(db);
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                const writeBatch2 = writeBatch(db);
                data.forEach(restaurant => {
                    const docRef = doc(collection(db, RESTAURANTS_COLLECTION));
                    writeBatch2.set(docRef, restaurant);
                });
                await writeBatch2.commit();
                localStorage.setItem('hk_restaurants', JSON.stringify(data));
                console.log('✅ 資料已同步至 Firebase');
                return true;
            } catch (error) {
                console.error('儲存至 Firebase 失敗:', error);
                localStorage.setItem('hk_restaurants', JSON.stringify(data));
                alert('⚠️ 雲端儲存失敗，資料已儲存於本地快取。請稍後再試。');
                return false;
            }
        }

        async function seedDefaultData() {
            try {
                const batch = writeBatch(db);
                DEFAULT_RESTAURANTS.forEach(restaurant => {
                    const docRef = doc(collection(db, RESTAURANTS_COLLECTION));
                    batch.set(docRef, restaurant);
                });
                await batch.commit();
                console.log('✅ 預設範例資料已寫入 Firebase');
                localStorage.setItem('hk_restaurants', JSON.stringify(DEFAULT_RESTAURANTS));
            } catch (error) {
                console.error('寫入預設資料失敗:', error);
                throw error;
            }
        }

        // =============================================================
        // 7. 狀態變數
        // =============================================================

        let restaurants = [];
        let map = null;
        let markersLayer = null;
        let userMarker = null;
        let geocodeMarker = null;
        let tempPinMarker = null;
        let pinModeActive = false;
        let activeDistrict = null;
        let activePrice = 'all';
        let activeStars = 'all';
        let activeCuisine = 'all';
        let filterBusiness = { environment: false, noise: false, few_people: false, private_room: false };
        let activePeriod = 'all';

        let currentPopupRestaurantId = null;
        let focusCommentOnOpen = false;

        let logoClickCount = 0;

        // =============================================================
        // 8. 初始化地圖
        // =============================================================

        function initMap() {
            const hkCenter = [22.3193, 114.1694];
            map = L.map('map', {
                maxBounds: HK_BOUNDS,
                maxBoundsViscosity: 1.0,
                center: hkCenter,
                zoom: 12
            });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);

            loadRestaurants().then(data => {
                restaurants = data;
                renderMarkers();
            }).catch(() => {
                restaurants = DEFAULT_RESTAURANTS;
                renderMarkers();
            });

            document.getElementById('locateBtn').addEventListener('click', doLocate);
            setupLocateEvents();
            setupCuisineFilters();
            setupBusinessFilters();
            setupPeriodFilters();
            document.getElementById('toggleMapBtn').addEventListener('click', toggleMap);
            setupFilterToggle();
            setupHiddenMode();
            setupPinMode();
        }

        // =============================================================
        // 9. GPS 定位
        // =============================================================

        const locateStatus = document.getElementById('locateStatus');
        const locateBtn = document.getElementById('locateBtn');

        function showStatus(msg, type) {
            locateStatus.textContent = msg;
            locateStatus.className = 'locate-status show';
            if (type) locateStatus.classList.add(type);
            clearTimeout(locateStatus._timer);
            locateStatus._timer = setTimeout(() => {
                locateStatus.classList.remove('show');
            }, 4000);
        }

        function doLocate() {
            if (!map) return;
            if (!navigator.geolocation) {
                showStatus('⚠️ 不支援定位', 'error');
                return;
            }
            locateBtn.classList.add('loading');
            showStatus('📍 定位中...', '');
            map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 15000 });
        }

        function setupLocateEvents() {
            map.on('locationfound', function(e) {
                locateBtn.classList.remove('loading');
                const latlng = e.latlng;
                if (userMarker) map.removeLayer(userMarker);
                const icon = L.divIcon({
                    html: `<div style="background:#007DFF;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px rgba(0,125,255,0.3);"></div>`,
                    className: '',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });
                userMarker = L.marker(latlng, { icon: icon }).addTo(map).bindPopup('📍 您的位置');
                setTimeout(() => { if (userMarker) userMarker.openPopup(); }, 300);
                showStatus('✅ 定位成功！', 'success');
                map.setView(latlng, 15);
            });
            map.on('locationerror', function(e) {
                locateBtn.classList.remove('loading');
                let msg = '⚠️ 定位失敗';
                if (e.message.includes('denied')) msg = '⚠️ 請允許定位權限';
                else if (e.message.includes('timeout')) msg = '⏱️ 定位超時';
                showStatus(msg, 'error');
                map.setView([22.3193, 114.1694], 12);
            });
        }

        // =============================================================

        function setupPinMode() {
            const pinBtn = document.getElementById('pinModeBtn');
            if (!pinBtn) return;

            pinBtn.addEventListener('click', function() {
                pinModeActive = !pinModeActive;
                pinBtn.classList.toggle('active', pinModeActive);
                map.getContainer().style.cursor = pinModeActive ? 'crosshair' : '';
                if (pinModeActive) {
                    showStatus('📌 圖釘模式已開啟，點擊地圖放置圖釘', '');
                } else {
                    showStatus('📌 圖釘模式已關閉', '');
                    if (tempPinMarker) {
                        map.removeLayer(tempPinMarker);
                        tempPinMarker = null;
                    }
                }
            });

            map.on('click', function(e) {
                if (!pinModeActive) return;
                placeTempPin(e.latlng);
            });

            // 全域事件委派：偵測圖釘彈窗中的「新增餐廳」按鈕
            document.addEventListener('click', function(e) {
                if (e.target && e.target.id === 'usePinLocationBtn') {
                    if (tempPinMarker && window.openAddModalWithCoords) {
                        const pos = tempPinMarker.getLatLng();
                        window.openAddModalWithCoords(pos.lat, pos.lng);
                    } else {
                        console.error('tempPinMarker or openAddModalWithCoords not ready');
                    }
                }
            });
        }

        function placeTempPin(latlng) {
            if (tempPinMarker) {
                map.removeLayer(tempPinMarker);
            }
            const icon = L.divIcon({
                html: `<div style="background:#FF6B6B;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid white;box-shadow:0 2px 12px rgba(0,0,0,0.3);">📍</div>`,
                className: '',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            tempPinMarker = L.marker(latlng, { icon: icon, draggable: true }).addTo(map);

            const popupContent = `
                <div>
                    <b>圖釘位置</b><br>
                    緯度: <span id="pinLat">${latlng.lat.toFixed(6)}</span><br>
                    經度: <span id="pinLng">${latlng.lng.toFixed(6)}</span><br>
                    <button class="btn btn-sm btn-primary" id="usePinLocationBtn">➕ 新增餐廳</button>
                </div>
            `;
            tempPinMarker.bindPopup(popupContent).openPopup();

            tempPinMarker.on('dragend', function() {
                const pos = tempPinMarker.getLatLng();
                document.getElementById('pinLat').textContent = pos.lat.toFixed(6);
                document.getElementById('pinLng').textContent = pos.lng.toFixed(6);
            });
        }

        // 13. 構建彈窗內容
        // =============================================================

        function buildInfoWindowContent(r) {
            const stars = '★'.repeat(r.rating) + '☆'.repeat(3 - r.rating);
            const priceLabel = PRICE_LABELS[r.price] || r.price;
            const priceClass = r.price;

            const biz = r.business || { environment: false, noise: false, few_people: false, private_room: false };
            const bizHtml = `
                <div class="iw-business">
                    <span class="${biz.environment ? 'yes' : 'no'}">${biz.environment ? '✅' : '❌'} 環境體面</span>
                    <span class="${biz.noise ? 'yes' : 'no'}">${biz.noise ? '✅' : '❌'} 環境寧靜</span>
                    <span class="${biz.few_people ? 'yes' : 'no'}">${biz.few_people ? '✅' : '❌'} 人數少</span>
                    <span class="${biz.private_room ? 'yes' : 'no'}">${biz.private_room ? '✅' : '❌'} 有包間</span>
                </div>
            `;

            let periodsHtml = '';
            if (r.promotionPeriods && r.promotionPeriods.length > 0) {
                const periodTags = r.promotionPeriods.map(p => `<span>${escapeHtml(p)}</span>`).join('');
                periodsHtml = `<div class="iw-periods">📅 推廣時段：${periodTags}</div>`;
            }

            let html = `
                <div class="info-window" data-restaurant-id="${r.id}">
                    <div class="iw-name">${escapeHtml(r.name)}</div>
                    <div class="iw-meta">
                        <span class="iw-stars">${stars}</span>
                        <span class="price-badge ${priceClass}">${escapeHtml(priceLabel)}</span>
                        <span style="font-size:12px;color:#8A9AA8;">${escapeHtml(r.district)}</span>
                    </div>
                    <div class="iw-address">📍 ${escapeHtml(r.location || '地址待補')}</div>
            `;
            if (r.cuisine) {
                html += `<div class="iw-meta" style="margin-top:2px;">
                            <span style="background:#F0F2F5;padding:1px 10px;border-radius:12px;font-size:12px;">${escapeHtml(r.cuisine)}</span>
                            ${r.phone ? `<span style="font-size:12px;color:#8A9AA8;">📞 ${escapeHtml(r.phone)}</span>` : ''}
                        </div>`;
            }
            if (r.hours) {
                html += `<div style="font-size:12px;color:#8A9AA8;margin:2px 0;">🕐 ${escapeHtml(r.hours)}</div>`;
            }
            if (r.recommender) {
                html += `<div class="iw-recommender">👤 推薦者：${escapeHtml(r.recommender)}</div>`;
            }
            if (r.image) {
                html += `<div style="margin-top:6px;"><img src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'" /></div>`;
            }

            html += bizHtml;
            html += periodsHtml;

            html += `<div class="iw-comments">`;
            html += `<div style="font-weight:600;font-size:14px;margin-bottom:6px;">💬 評論 (${r.comments ? r.comments.length : 0})</div>`;
            if (r.comments && r.comments.length > 0) {
                const sorted = [...r.comments].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                sorted.forEach(c => {
                    const rec = c.recommender ? `<span class="rec">👤 ${escapeHtml(c.recommender)}</span>` : '';
                    html += `<div class="comment-item"><div class="comment-text">${escapeHtml(c.text)}</div><div class="comment-meta">${escapeHtml(c.timestamp)} ${rec}</div></div>`;
                });
            } else {
                html += `<div style="color:#8A9AA8;font-size:13px;">尚無評論</div>`;
            }
            html += `
                <div class="iw-comment-form">
                    <div style="font-weight:500;font-size:13px;margin:6px 0 4px;">📝 新增評論</div>
                    <input type="password" class="comment-pwd" placeholder="管理密碼" />
                    <textarea class="comment-textarea" placeholder="寫下你的評論..." rows="2"></textarea>
                    <div class="form-row">
                        <input type="text" class="comment-recommender" placeholder="推薦者 (選填)" />
                        <button class="btn-submit" type="button">提交評論</button>
                    </div>
                    <div class="comment-error"></div>
                    <div class="comment-success"></div>
                </div>
            `;
            html += `</div></div>`;
            return html;
        }

        // 評論提交事件
        function bindCommentForm(popupContainer, restaurantId) {
            const form = popupContainer.querySelector('.iw-comment-form');
            if (!form) return;
            const pwdInput = form.querySelector('.comment-pwd');
            const textarea = form.querySelector('.comment-textarea');
            const recommenderInput = form.querySelector('.comment-recommender');
            const submitBtn = form.querySelector('.btn-submit');
            const errorDiv = form.querySelector('.comment-error');
            const successDiv = form.querySelector('.comment-success');
            const newBtn = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newBtn, submitBtn);
            newBtn.addEventListener('click', async function() {
                const password = pwdInput.value.trim();
                const text = textarea.value.trim();
                const recommender = recommenderInput.value.trim();
                if (password !== STATIC_PASSWORD) {
                    errorDiv.textContent = '❌ 密碼錯誤';
                    errorDiv.style.display = 'block';
                    successDiv.style.display = 'none';
                    pwdInput.value = '';
                    pwdInput.focus();
                    return;
                }
                if (!text) {
                    errorDiv.textContent = '請填寫評論';
                    errorDiv.style.display = 'block';
                    successDiv.style.display = 'none';
                    textarea.focus();
                    return;
                }
                errorDiv.style.display = 'none';
                const restaurant = restaurants.find(r => r.id === restaurantId);
                if (!restaurant) {
                    errorDiv.textContent = '❌ 找不到餐廳';
                    errorDiv.style.display = 'block';
                    return;
                }
                const now = new Date();
                const timestamp =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                restaurant.comments.push({ text, timestamp, recommender });
                const index = restaurants.findIndex(r => r.id === restaurantId);
                if (index !== -1) restaurants[index] = restaurant;
                try {
                    await signInAnonymously(auth);
                    await saveRestaurants(restaurants);
                    await signOut(auth);
                    renderMarkers();
                    setTimeout(() => openPopupForRestaurant(restaurantId, false), 100);
                    pwdInput.value = '';
                    textarea.value = '';
                    recommenderInput.value = '';
                    successDiv.textContent = '✅ 評論已新增！';
                    successDiv.style.display = 'block';
                    setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
                } catch (error) {
                    errorDiv.textContent = '❌ 儲存失敗';
                    errorDiv.style.display = 'block';
                }
            });
        }

        function openPopupForRestaurant(restaurantId, focusComment = false) {
            const restaurant = restaurants.find(r => r.id === restaurantId);
            if (!restaurant || !restaurant.lat || !restaurant.lng) return;
            let targetMarker = null;
            markersLayer.eachLayer(layer => {
                if (layer.options && layer.options.restaurantId === restaurantId) {
                    targetMarker = layer;
                }
            });
            if (!targetMarker) {
                markersLayer.eachLayer(layer => {
                    if (layer.getLatLng) {
                        const latlng = layer.getLatLng();
                        if (Math.abs(latlng.lat - restaurant.lat) < 0.0001 &&
                            Math.abs(latlng.lng - restaurant.lng) < 0.0001) {
                            targetMarker = layer;
                        }
                    }
                });
            }
            if (targetMarker) {
                map.setView([restaurant.lat, restaurant.lng], 14);
                focusCommentOnOpen = focusComment;
                targetMarker.openPopup();
            }
        }

        // =============================================================
        // 14. 渲染標記
        // =============================================================

        function renderMarkers() {
            markersLayer.clearLayers();
            const filtered = getFilteredRestaurants();
            if (filtered.length === 0) {
                document.getElementById('restaurantList').innerHTML =
                    '<div class="text-muted" style="text-align:center;padding:20px 0;">沒有符合條件的餐廳</div>';
                document.getElementById('mobileRestaurantList').innerHTML =
                    '<div class="text-muted" style="text-align:center;padding:20px 0;">沒有符合條件的餐廳</div>';
                return;
            }
            const currentId = currentPopupRestaurantId;
            filtered.forEach(r => {
                if (!r.lat || !r.lng) return;
                const color = PRICE_COLORS[r.price] || '#007DFF';
                const icon = createRestaurantIcon(color);
                const marker = L.marker([r.lat, r.lng], { icon: icon, restaurantId: r.id });
                const popupContent = buildInfoWindowContent(r);
                marker.bindPopup(popupContent, { maxWidth: 320, minWidth: 280 });
                marker.on('popupopen', function() {
                    const popup = this.getPopup();
                    const container = popup.getElement();
                    if (container) {
                        bindCommentForm(container, r.id);
                        currentPopupRestaurantId = r.id;
                        if (focusCommentOnOpen) {
                            const textarea = container.querySelector('.comment-textarea');
                            if (textarea) {
                                setTimeout(() => {
                                    textarea.focus();
                                    textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }, 300);
                            }
                            focusCommentOnOpen = false;
                        }
                    }
                });
                marker.on('popupclose', function() {
                    currentPopupRestaurantId = null;
                });
                markersLayer.addLayer(marker);
            });
            renderList(filtered);
            renderMobileList(filtered);
            if (filtered.length === 1) {
                map.setView([filtered[0].lat, filtered[0].lng], 15);
            } else if (filtered.length > 0) {
                const group = L.featureGroup();
                filtered.forEach(r => { if (r.lat && r.lng) group.addLayer(L.marker([r.lat, r.lng])); });
                if (group.getLayers().length > 0) {
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }
            }
            if (currentId) {
                setTimeout(() => openPopupForRestaurant(currentId, false), 200);
            }
        }

        // =============================================================
        // 15. 過濾邏輯
        // =============================================================

        function getFilteredRestaurants() {
            return restaurants.filter(r => {
                // 地區過濾
                if (activeDistrict === 'other') {
                    if (DISTRICTS.includes(r.district)) return false;
                } else if (activeDistrict && r.district !== activeDistrict) {
                    return false;
                }

                // 價格過濾
                if (activePrice !== 'all' && r.price !== activePrice) return false;

                // 星級過濾
                if (activeStars !== 'all' && r.rating !== parseInt(activeStars)) return false;

                // 品類過濾
                if (activeCuisine !== 'all') {
                    // 指定品類時必須完全匹配
                    if (r.cuisine !== activeCuisine) return false;
                } else {
                    // 「全部」不包含打卡地點
                    if (r.cuisine === '打卡地點' && !hiddenModeActive) return false;
                }

                // 生意特性過濾
                const biz = r.business || { environment: false, noise: false, few_people: false, private_room: false };
                if (filterBusiness.environment && !biz.environment) return false;
                if (filterBusiness.noise && !biz.noise) return false;
                if (filterBusiness.few_people && !biz.few_people) return false;
                if (filterBusiness.private_room && !biz.private_room) return false;

                // 推廣時段過濾
                if (activePeriod !== 'all') {
                    if (!r.promotionPeriods || !r.promotionPeriods.includes(activePeriod)) return false;
                }

                return true;
            });
        }

        function renderDistrictButtons() {

            DISTRICTS.forEach(d => {
                html += `<div class="district-tag" data-district="${d}">${d}</div>`;
            });
            html += `<div class="district-tag" data-district="other">其他</div>`;
            grid.innerHTML = html;
            grid.querySelectorAll('.district-tag').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    grid.querySelectorAll('.district-tag').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const val = this.dataset.district;
                    activeDistrict = val === '' ? null : val;
                    syncMobileDistrict(activeDistrict);
                    renderMarkers();
                });

            const desktopContainer = document.getElementById('businessFilter');

            function handleBusinessToggle(element) {
                const field = element.dataset.business;
                element.classList.toggle('active');
                filterBusiness[field] = element.classList.contains('active');
                const otherContainer = element.closest('.filter-group') ? mobileContainer : desktopContainer;
                const target = otherContainer.querySelector(`[data-business="${field}"]`);
                if (target) {
                    target.classList.toggle('active', filterBusiness[field]);

        // 搜尋地址建議（返回前5筆））
        async function searchAddressSuggestions(address, limit = 5) {
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            const searchUrl = `https://www.map.gov.hk/gs/api/v1.0.0/locationSearch?q=${encodeURIComponent(address)}`;

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(searchUrl));
                if (!response.ok) throw new Error(`搜尋 API 失敗: ${response.status}`);
                const data = await response.json();

                if (!data || data.length === 0) return [];

                const results = data.slice(0, limit);

                const convertPromises = results.map(async (item) => {
                    const hkX = item.x;
                    const hkY = item.y;
                    if (!hkX || !hkY) return null;

                    const convertUrl = `https://data.gov.hk/api/coordinate-conversion-api/v1/convert?input=hk1980&output=wgs84&x=${hkX}&y=${hkY}`;
                    const convertResponse = await fetch(proxyUrl + encodeURIComponent(convertUrl));
                    if (!convertResponse.ok) return null;
                    const convertData = await convertResponse.json();

                    let lat, lng;
                    if (convertData.wgs84) {
                        lat = convertData.wgs84.lat;
                        lng = convertData.wgs84.lng;
                    } else if (convertData.lat && convertData.lng) {
                        lat = convertData.lat;
                        lng = convertData.lng;
                    } else if (convertData.result && convertData.result.wgs84) {
                        lat = convertData.result.wgs84.lat;
                        lng = convertData.result.wgs84.lng;
                    } else {
                        lat = convertData.lat || convertData.result?.lat;
                        lng = convertData.lng || convertData.result?.lng;
                    }

                    if (!lat || !lng || isNaN(lat) || isNaN(lng)) return null;

                    return {
                        name: item.nameZH || item.nameEN || '',
                        address: item.addressZH || item.addressEN || '',
                        district: item.districtZH || '',
                        lat: parseFloat(lat),
                        lng: parseFloat(lng),
                        raw: item
                    };
                });

                const converted = await Promise.all(convertPromises);
                return converted.filter(s => s !== null);
            } catch (error) {
                console.error('地址建議搜尋失敗:', error);
                return [];
            }
        }
        
        // 地址搜尋函數 (使用 map.gov.hk API)
        async function searchAddress(query, districtFilter) {
            if (!query || query.length < 2) return [];
            try {
                const url = `https://www.map.gov.hk/gs/api/v1.0.0/locationSearch?q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                if (!response.ok) return [];
                const data = await response.json();
                if (!data || data.length === 0) return [];
                let filtered = data;
                if (districtFilter && districtFilter !== '' && districtFilter !== 'other') {
                    filtered = data.filter(item => item.districtZH === districtFilter);
                }
                return filtered.slice(0, 5).filter(item => item.nameZH || item.addressZH);
            } catch (error) {
                console.error('地址搜尋失敗:', error);
                return [];
            }
        }

        // HK1980 轉 WGS84
        function convertHK1980toWGS84(x, y) {
            try {
                const result = window.proj4('HK1980', 'WGS84', [x, y]);
                return { lat: result[1], lng: result[0] };
            } catch (e) {
                console.error('座標轉換失敗:', e);
                return null;
            }
        }

            let searchTimeout = null;  // ✅ 加入防抖變數

            // 地區選項

            // =============================================================
            // ✅ 新增：餐廳名稱輸入自動搜尋
            // =============================================================
            nameInput.addEventListener('input', function() {
                const query = this.value.trim();
                clearTimeout(searchTimeout);

                if (query.length < 2) {
                    suggestionsDiv.style.display = 'none';
                    return;
                }

                const selectedDistrict = districtSelect.value;

                searchTimeout = setTimeout(async () => {
                    const results = await searchAddress(query, selectedDistrict);
                    if (results.length === 0) {
                        suggestionsDiv.style.display = 'none';

                    let html = '';

                        html += `
                            <div class="suggestion-item" data-x="${item.x}" data-y="${item.y}" data-district="${item.districtZH || ''}" data-name="${escapeHtml(name)}" data-address="${escapeHtml(addr)}">

                        `;

                    suggestionsDiv.innerHTML = html;
                    suggestionsDiv.style.display = 'block';
                    geocodeStatus.textContent = `✅ 找到 ${results.length} 筆結果 (地區：${selectedDistrict || '全部'})`;
                    geocodeStatus.className = 'geocode-status success';

                    suggestionsDiv.querySelectorAll('.suggestion-item').forEach(el => {
                        el.addEventListener('click', function() {
                            const x = parseFloat(this.dataset.x);
                            const y = parseFloat(this.dataset.y);
                            const district = this.dataset.district;
                            const name = this.dataset.name;
                            const address = this.dataset.address;

                            if (district && districtSelect.value === '') {

                                if (opt) districtSelect.value = district;
                            }

                            if (x && y) {
                                const coords = convertHK1980toWGS84(x, y);
                                if (coords) {
                                    latInput.value = coords.lat.toFixed(6);
                                    lngInput.value = coords.lng.toFixed(6);
                                    geocodeStatus.textContent = `✅ 已定位：${name} (${district || ''})`;
                                    geocodeStatus.className = 'geocode-status success';

                                    if (geocodeMarker) map.removeLayer(geocodeMarker);
                                    const icon = L.divIcon({
                                        html: `<div style="background:#6C5CE7;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">📍</div>`,
                                        className: '',
                                        iconSize: [24, 24],
                                        iconAnchor: [12, 12]
                                    });
                                    geocodeMarker = L.marker([coords.lat, coords.lng], { icon: icon })
                                        .addTo(map)
                                        .bindPopup(`📍 ${escapeHtml(name || '搜尋結果')}`)
                                        .openPopup();
                                    map.setView([coords.lat, coords.lng], 16);
                                }
                            }

                            suggestionsDiv.style.display = 'none';
                        });
                    });
                }, 400);
            });

            // 點擊其他地方關閉建議
            document.addEventListener('click', function(e) {

            // =============================================================

            geocodeBtn.addEventListener('click', async function() {
