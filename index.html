<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>香港餐廳地圖 - 18區美食指南</title>

    <!-- ===== Leaflet CSS & JS ===== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        /* ============================================================
                   HarmonyOS Design System + 手機優化
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F7F9FA;
            color: #1A1A1A;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- 頂部導航 ---------- */
        .app-header {
            height: 56px;
            background: #FFFFFF;
            border-bottom: 1px solid #E8ECF0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 20;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #1A1A1A;
        }
        .app-header .logo span {
            color: #007DFF;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hamburger {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            color: #1A1A1A;
        }

        /* ---------- 按鈕 ---------- */
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #F1F3F5;
            color: #1A1A1A;
        }
        .btn:hover {
            background: #E8ECF0;
        }
        .btn-primary {
            background: #007DFF;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0066CC;
        }
        .btn-success {
            background: #2ED573;
            color: #fff;
        }
        .btn-success:hover {
            background: #26B861;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        /* ---------- 主佈局 ---------- */
        .app-body {
            display: flex;
            height: calc(100vh - 56px);
            position: relative;
        }

        /* ---------- 側邊欄 (可收合) ---------- */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #FFFFFF;
            border-right: 1px solid #E8ECF0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
            z-index: 15;
        }
        .sidebar-section {
            padding: 12px 16px 10px;
            border-bottom: 1px solid #F1F3F5;
        }
        .sidebar-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: #6B7A8A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* 地區標籤 */
        .district-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .district-grid::-webkit-scrollbar {
            width: 4px;
        }
        .district-grid::-webkit-scrollbar-thumb {
            background: #D0D7DE;
            border-radius: 4px;
        }
        .district-tag {
            padding: 4px 0;
            text-align: center;
            font-size: 12px;
            border-radius: 8px;
            background: #F7F9FA;
            color: #4A5A6A;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            user-select: none;
        }
        .district-tag:hover {
            background: #E8F0FE;
            color: #007DFF;
            border-color: #007DFF;
        }
        .district-tag.active {
            background: #007DFF;
            color: #fff;
            border-color: #007DFF;
        }

        /* 價格 & 星級 & 品類過濾 */
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .filter-tag {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            background: #F7F9FA;
            color: #4A5A6A;
        }
        .filter-tag:hover {
            transform: scale(1.03);
        }
        .filter-tag.active {
            border-color: #007DFF;
            background: #E8F0FE;
        }
        .filter-tag.high {
            color: #FF4757;
        }
        .filter-tag.high.active {
            background: #FFE8EA;
            border-color: #FF4757;
        }
        .filter-tag.medium {
            color: #FFA502;
        }
        .filter-tag.medium.active {
            background: #FFF3E0;
            border-color: #FFA502;
        }
        .filter-tag.low {
            color: #2ED573;
        }
        .filter-tag.low.active {
            background: #E8F9EF;
            border-color: #2ED573;
        }
        .filter-tag.star {
            color: #FFB800;
        }
        .filter-tag.star.active {
            background: #FFF8E1;
            border-color: #FFB800;
        }
        .filter-tag.cuisine {
            color: #6C5CE7;
        }
        .filter-tag.cuisine.active {
            background: #EDE7F6;
            border-color: #6C5CE7;
        }

        /* 餐廳列表 */
        .restaurant-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 20px;
        }
        .restaurant-list::-webkit-scrollbar {
            width: 4px;
        }
        .restaurant-list::-webkit-scrollbar-thumb {
            background: #D0D7DE;
            border-radius: 4px;
        }

        .restaurant-card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #F1F3F5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .restaurant-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }
        .restaurant-card .name {
            font-size: 15px;
            font-weight: 600;
            color: #1A1A1A;
        }
        .restaurant-card .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 13px;
            color: #6B7A8A;
            flex-wrap: wrap;
        }
        .restaurant-card .price-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .price-badge.high {
            background: #FFE8EA;
            color: #FF4757;
        }
        .price-badge.medium {
            background: #FFF3E0;
            color: #FFA502;
        }
        .price-badge.low {
            background: #E8F9EF;
            color: #2ED573;
        }
        .restaurant-card .stars {
            color: #FFB800;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .restaurant-card .district-label {
            font-size: 12px;
            color: #8A9AA8;
            background: #F7F9FA;
            padding: 1px 8px;
            border-radius: 12px;
        }
        .restaurant-card .comment-preview {
            font-size: 13px;
            color: #6B7A8A;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .restaurant-card .cuisine-type {
            font-size: 12px;
            color: #8A9AA8;
            background: #F0F2F5;
            padding: 1px 8px;
            border-radius: 12px;
        }
        .restaurant-card .recommender {
            font-size: 12px;
            color: #8A9AA8;
            margin-top: 2px;
        }

        /* ---------- 地圖容器 ---------- */
        .map-container {
            flex: 1;
            position: relative;
            background: #E8ECF0;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* ---------- 浮動定位按鈕 ---------- */
        .locate-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 500;
            background: #FFFFFF;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            font-size: 22px;
            color: #007DFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .locate-btn:hover {
            transform: scale(1.05);
            background: #F0F7FF;
        }
        .locate-btn:active {
            transform: scale(0.95);
        }

        /* ---------- Leaflet 彈窗樣式 ---------- */
        .leaflet-popup-content {
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            min-width: 200px;
        }
        .leaflet-popup-content .iw-name {
            font-size: 17px;
            font-weight: 700;
            color: #1A1A1A;
        }
        .leaflet-popup-content .iw-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 4px 0 6px;
            font-size: 13px;
            color: #6B7A8A;
        }
        .leaflet-popup-content .iw-stars {
            color: #FFB800;
        }
        .leaflet-popup-content .iw-address {
            font-size: 13px;
            color: #6B7A8A;
            margin: 2px 0;
        }
        .leaflet-popup-content .iw-comment {
            font-size: 13px;
            color: #4A5A6A;
            background: #F7F9FA;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .leaflet-popup-content .iw-recommender {
            font-size: 12px;
            color: #8A9AA8;
            margin-top: 2px;
        }
        .leaflet-popup-content .price-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .leaflet-popup-content .price-badge.high {
            background: #FFE8EA;
            color: #FF4757;
        }
        .leaflet-popup-content .price-badge.medium {
            background: #FFF3E0;
            color: #FFA502;
        }
        .leaflet-popup-content .price-badge.low {
            background: #E8F9EF;
            color: #2ED573;
        }

        /* ---------- 模態框 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 24px 32px;
            max-width: 480px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1A1A1A;
        }
        .modal .form-group {
            margin-bottom: 12px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4A5A6A;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
            background: #FAFBFC;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: #007DFF;
            box-shadow: 0 0 0 3px rgba(0, 125, 255, 0.12);
            background: #FFFFFF;
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
        }
        .modal .form-row .form-group {
            flex: 1;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #F1F3F5;
        }
        .modal .error-msg {
            color: #FF4757;
            font-size: 13px;
            margin-top: -6px;
            margin-bottom: 6px;
            display: none;
        }
        .modal .error-msg.show {
            display: block;
        }
        .modal .hidden-field {
            display: none;
        }

        /* ---------- 手機響應式 ---------- */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }
            .sidebar {
                position: fixed;
                top: 56px;
                left: 0;
                width: 300px;
                height: calc(100vh - 56px);
                transform: translateX(-105%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
                border-right: none;
                z-index: 30;
                background: #FFFFFF;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-backdrop {
                display: none;
                position: fixed;
                top: 56px;
                left: 0;
                width: 100%;
                height: calc(100vh - 56px);
                background: rgba(0, 0, 0, 0.3);
                z-index: 25;
            }
            .sidebar-backdrop.active {
                display: block;
            }
            .app-body {
                flex-direction: column;
                height: calc(100vh - 56px);
            }
            .map-container {
                height: 100%;
                width: 100%;
            }
            .district-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
            .modal {
                padding: 20px;
            }
            .modal .form-row {
                flex-direction: column;
                gap: 0;
            }
            .locate-btn {
                bottom: 20px;
                right: 16px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
        }
        @media (max-width: 480px) {
            .district-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .app-header .logo {
                font-size: 15px;
            }
            .header-actions .btn span {
                display: none;
            }
        }

        /* 工具 */
        .text-muted {
            color: #8A9AA8;
            font-size: 13px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ===== 主應用 ===== -->
    <div id="app">
        <!-- 頂部導航 -->
        <header class="app-header">
            <div style="display:flex;align-items:center;gap:6px;">
                <button class="hamburger" id="hamburgerBtn">☰</button>
                <div class="logo">🍜 <span>食在地圖</span></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary btn-sm" id="openAddBtn">＋ 新增</button>
            </div>
        </header>

        <div class="app-body">
            <!-- 側邊欄遮罩 (手機) -->
            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

            <!-- 側邊欄 -->
            <aside class="sidebar" id="sidebar">
                <!-- 地區 -->
                <div class="sidebar-section">
                    <h3>🏙️ 地區 · 點擊切換</h3>
                    <div class="district-grid" id="districtGrid"></div>
                </div>

                <!-- 價格 -->
                <div class="sidebar-section">
                    <h3>💰 價格等級</h3>
                    <div class="filter-group" id="priceFilter">
                        <span class="filter-tag active" data-price="all">全部</span>
                        <span class="filter-tag high" data-price="high">高 &gt;$800</span>
                        <span class="filter-tag medium" data-price="medium">中 &gt;$300</span>
                        <span class="filter-tag low" data-price="low">低 &lt;$300</span>
                    </div>
                </div>

                <!-- 星級 -->
                <div class="sidebar-section">
                    <h3>⭐ 星級篩選</h3>
                    <div class="filter-group" id="starFilter">
                        <span class="filter-tag star active" data-stars="all">全部</span>
                        <span class="filter-tag star" data-stars="1">★ (1星)</span>
                        <span class="filter-tag star" data-stars="2">★★ (2星)</span>
                        <span class="filter-tag star" data-stars="3">★★★ (3星)</span>
                    </div>
                </div>

                <!-- 品類 (菜系) -->
                <div class="sidebar-section">
                    <h3>🍽️ 品類</h3>
                    <div class="filter-group" id="cuisineFilter">
                        <span class="filter-tag cuisine active" data-cuisine="all">全部</span>
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 餐廳列表 -->
                <div class="restaurant-list" id="restaurantList">
                    <div class="text-muted" style="text-align:center;padding:30px 0;">載入餐廳中...</div>
                </div>
            </aside>

            <!-- 地圖 -->
            <div class="map-container">
                <div id="map"></div>
                <button class="locate-btn" id="locateBtn" title="定位到我">📍</button>
            </div>
        </div>
    </div>

    <!-- ===== 新增餐廳模態框 ===== -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>➕ 新增餐廳</h2>
            <form id="addForm" autocomplete="off">
                <div class="form-group">
                    <label>管理員密碼 *</label>
                    <input type="password" id="fPassword" placeholder="請輸入管理密碼" required />
                    <div class="error-msg" id="pwdError">密碼錯誤，請重新輸入</div>
                </div>
                <div class="form-group">
                    <label>餐廳名稱 *</label>
                    <input type="text" id="fName" placeholder="例：龍景軒" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>地區 *</label>
                        <select id="fDistrict" required>
                            <option value="">請選擇</option>
                            <!-- 18區由 JS 填入，另加 "其他" 選項 -->
                        </select>
                    </div>
                    <div class="form-group" id="customDistrictGroup" style="display:none;">
                        <label>自訂地區名稱</label>
                        <input type="text" id="fCustomDistrict" placeholder="例如：錦田" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>價格等級 *</label>
                        <select id="fPrice" required>
                            <option value="high">高 (>$800)</option>
                            <option value="medium">中 (>$300)</option>
                            <option value="low">低 (<$300)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>評分 (1-3星)</label>
                        <select id="fRating">
                            <option value="3">★★★ (3)</option>
                            <option value="2" selected>★★☆ (2)</option>
                            <option value="1">★☆☆ (1)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>品類 (菜系)</label>
                    <input type="text" id="fCuisine" placeholder="粵菜、日式..." />
                </div>
                <div class="form-group">
                    <label>地址 / 位置 *</label>
                    <input type="text" id="fLocation" placeholder="中環皇后大道中15號" required />
                </div>
                <div class="form-group">
                    <label>電話</label>
                    <input type="text" id="fPhone" placeholder="+852 1234 5678" />
                </div>
                <div class="form-group">
                    <label>營業時間</label>
                    <input type="text" id="fHours" placeholder="11:00-22:00" />
                </div>
                <div class="form-group">
                    <label>推薦者 (選填)</label>
                    <input type="text" id="fRecommender" placeholder="例如：陳大文" />
                </div>
                <div class="form-group">
                    <label>圖片網址 (選填)</label>
                    <input type="url" id="fImage" placeholder="https://example.com/photo.jpg" />
                </div>
                <div class="form-group">
                    <label>評論 / 備註</label>
                    <textarea id="fComment" placeholder="分享你的用餐體驗..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="closeAddBtn">取消</button>
                    <button type="submit" class="btn btn-success">✓ 新增餐廳</button>
                </div>
            </form>
        </div>
    </div>


    <!-- ============================================================
    JavaScript
    ============================================================ -->
    <script>
        // =============================================================
        // 1. 安全輔助函數 (同前)
        // =============================================================

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function isValidUrl(string) {
            if (!string) return true;
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function isValidPhone(string) {
            if (!string) return true;
            return /^[\+\d\s\-\(\)]{7,20}$/.test(string);
        }

        function isValidName(string) {
            return string && string.trim().length >= 1 && string.trim().length <= 50;
        }

        function isValidLocation(string) {
            return string && string.trim().length >= 1 && string.trim().length <= 200;
        }

        // =============================================================
        // 2. 設定
        // =============================================================

        const STATIC_PASSWORD = 'hkfood2026';

        const DISTRICTS = [

        const DEFAULT_RESTAURANTS = RAW_DEFAULT.map(r => ({

        // =============================================================
        // 4. 狀態管理 (含自動轉換舊資料)
        // =============================================================

        function loadRestaurants() {
            let stored = localStorage.getItem('hk_restaurants');
            let data;
            if (stored) {
                try {
                    data = JSON.parse(stored);
                    data = data.map(r => {
                        if (r.rating > 3) r.rating = convertRating(r.rating);
                        if (!r.hasOwnProperty('recommender')) r.recommender = '';
                        return r;
                    });
                } catch (e) {
                    data = DEFAULT_RESTAURANTS;
                }
            } else {
                data = DEFAULT_RESTAURANTS;
            }
            localStorage.setItem('hk_restaurants', JSON.stringify(data));
            return data;
        }

        function saveRestaurants(data) {
            localStorage.setItem('hk_restaurants', JSON.stringify(data));
        }

        let restaurants = loadRestaurants();
        let map = null;
        let markersLayer = null;
        let userMarker = null;
        let activeDistrict = null; // null 或 'other' 或具體區域名
        let activePrice = 'all';
        let activeStars = 'all';
        let activeCuisine = 'all'; // 新增品類篩選
        let nextId = restaurants.reduce((max, r) => Math.max(max, parseInt(r.id.replace('r', '')) || 0), 0) + 1;

        // =============================================================
        // 5. 初始化地圖
        // =============================================================

        function initMap() {
            const hkCenter = [22.3193, 114.1694];
            map = L.map('map', {
                maxBounds: HK_BOUNDS,
                maxBoundsViscosity: 1.0,
                center: hkCenter,
                zoom: 12
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            renderMarkers();

            document.getElementById('locateBtn').addEventListener('click', doLocate);
            setupLocateEvents();
            setupMobileSidebar();
        }

        // =============================================================
        // 6. 手機側邊欄 (同前)
        // =============================================================

        function setupMobileSidebar() {
            const hamburger = document.getElementById('hamburgerBtn');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');

            function toggleSidebar(open) {
                sidebar.classList.toggle('open', open);
                backdrop.classList.toggle('active', open);
            }

            hamburger.addEventListener('click', () => {
                const isOpen = sidebar.classList.contains('open');
                toggleSidebar(!isOpen);
            });

            backdrop.addEventListener('click', () => toggleSidebar(false));

            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const isSidebar = sidebar.contains(e.target) || hamburger.contains(e.target);
                    if (!isSidebar) toggleSidebar(false);
                }
            });
        }

        // =============================================================
        // 7. GPS 定位
        // =============================================================

        function doLocate() {
            if (!map) return;
            map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 10000 });
        }

        function setupLocateEvents() {
            map.on('locationfound', function(e) {
                const latlng = e.latlng;
                if (userMarker) map.removeLayer(userMarker);
                const icon = L.divIcon({
                    html: '<div style="background:#007DFF;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px rgba(0,125,255,0.4);"></div>',
                    className: '',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });
                userMarker = L.marker(latlng, { icon: icon }).addTo(map)
                    .bindPopup('📍 您的位置').openPopup();
            });
            map.on('locationerror', function(e) {
                alert('無法獲取您的位置，請確認已允許定位權限。');
            });
        }

        // =============================================================
        // 8. 自訂標記圖標 (取消圓點，改用餐盤圖示)
        // =============================================================

        function createRestaurantIcon(color) {
            return L.divIcon({
                html: `<div style="background-color:${color};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">🍽️</div>`,
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        // =============================================================
        // 9. 渲染標記 (使用自訂圖標)
        // =============================================================

        function renderMarkers() {
            markersLayer.clearLayers();
            const filtered = getFilteredRestaurants();

            if (filtered.length === 0) {
                document.getElementById('restaurantList').innerHTML =
                    '<div class="text-muted" style="text-align:center;padding:40px 0;">沒有符合條件的餐廳</div>';
                return;
            }

            filtered.forEach(r => {
                if (!r.lat || !r.lng) return;
                const color = PRICE_COLORS[r.price] || '#007DFF';
                const icon = createRestaurantIcon(color);
                const marker = L.marker([r.lat, r.lng], { icon: icon });
                const popupContent = buildInfoWindowContent(r);
                marker.bindPopup(popupContent, { maxWidth: 280 });
                markersLayer.addLayer(marker);
            });

            renderList(filtered);

            if (filtered.length === 1) {
                map.setView([filtered[0].lat, filtered[0].lng], 15);
            } else if (filtered.length > 0) {
                const group = L.featureGroup();
                filtered.forEach(r => {
                    if (r.lat && r.lng) group.addLayer(L.marker([r.lat, r.lng]));
                });
                if (group.getLayers().length > 0) {
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }
            }
        }

        // =============================================================
        // 10. 過濾邏輯 (含地區 'other' 與品類)
        // =============================================================

        function getFilteredRestaurants() {
            return restaurants.filter(r => {
                // 地區
                if (activeDistrict === 'other') {
                    // 其他：不屬於 18 區
                    if (DISTRICTS.includes(r.district)) return false;
                } else if (activeDistrict) {
                    // 特定區
                    if (r.district !== activeDistrict) return false;
                }
                // 價格
                if (activePrice !== 'all' && r.price !== activePrice) return false;
                // 星級 (精確匹配)
                if (activeStars !== 'all' && r.rating !== parseInt(activeStars)) return false;
                // 品類
                if (activeCuisine !== 'all') {
                    if (!r.cuisine || r.cuisine !== activeCuisine) return false;
                }
                return true;
            });
        }

        // =============================================================
        // 11. 彈窗內容 (安全轉義)
        // =============================================================

        function buildInfoWindowContent(r) {
            const stars = '★'.repeat(r.rating) + '☆'.repeat(3 - r.rating);
            const priceLabel = PRICE_LABELS[r.price] || r.price;
            const priceClass = r.price;

            let html = `
                <div class="info-window">
                    <div class="iw-name">${escapeHtml(r.name)}</div>
                    <div class="iw-meta">
                        <span class="iw-stars">${stars}</span>
                        <span class="price-badge ${priceClass}">${escapeHtml(priceLabel)}</span>
                        <span style="font-size:12px;color:#8A9AA8;">${escapeHtml(r.district)}</span>
                    </div>
                    <div class="iw-address">📍 ${escapeHtml(r.location || '地址待補')}</div>
            `;
            if (r.cuisine) {
                html += `<div class="iw-meta" style="margin-top:2px;">
                            <span style="background:#F0F2F5;padding:1px 10px;border-radius:12px;font-size:12px;">${escapeHtml(r.cuisine)}</span>
                            ${r.phone ? `<span style="font-size:12px;color:#8A9AA8;">📞 ${escapeHtml(r.phone)}</span>` : ''}
                        </div>`;
            }
            if (r.hours) {
                html += `<div style="font-size:12px;color:#8A9AA8;margin:2px 0;">🕐 ${escapeHtml(r.hours)}</div>`;
            }
            if (r.recommender) {
                html += `<div class="iw-recommender">👤 推薦者：${escapeHtml(r.recommender)}</div>`;
            }
            if (r.comment) {
                html += `<div class="iw-comment">💬 ${escapeHtml(r.comment)}</div>`;
            }
            if (r.image) {
                html += `<div style="margin-top:6px;"><img src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'" /></div>`;
            }
            html += `</div>`;
            return html;
        }

        // =============================================================
        // 12. 側邊欄列表 (安全轉義)
        // =============================================================

        function renderList(filtered) {
            const container = document.getElementById('restaurantList');
            if (!filtered || filtered.length === 0) {
                container.innerHTML =
                    '<div class="text-muted" style="text-align:center;padding:40px 0;">沒有符合條件的餐廳 🍽️</div>';
                return;
            }

            let html = '';
            filtered.forEach(r => {
                const stars = '★'.repeat(r.rating) + '☆'.repeat(3 - r.rating);
                const priceClass = r.price;
                const priceLabel = PRICE_LABELS[r.price] || r.price;

                html += `
                    <div class="restaurant-card" data-id="${r.id}">
                        <div class="name">${escapeHtml(r.name)}</div>
                        <div class="meta">
                            <span class="stars">${stars}</span>
                            <span class="price-badge ${priceClass}">${escapeHtml(priceLabel)}</span>
                            <span class="district-label">${escapeHtml(r.district)}</span>
                            ${r.cuisine ? `<span class="cuisine-type">${escapeHtml(r.cuisine)}</span>` : ''}
                        </div>
                        ${r.comment ? `<div class="comment-preview">💬 ${escapeHtml(r.comment)}</div>` : ''}
                        <div style="font-size:12px;color:#8A9AA8;margin-top:4px;">📍 ${escapeHtml(r.location || '地址待補')}</div>
                        ${r.recommender ? `<div class="recommender">👤 推薦者：${escapeHtml(r.recommender)}</div>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;

            // 卡片點擊定位 (同前)
            container.querySelectorAll('.restaurant-card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const restaurant = restaurants.find(r => r.id === id);
                    if (!restaurant || !restaurant.lat || !restaurant.lng) return;

                    let targetMarker = null;
                    markersLayer.eachLayer(layer => {
                        if (layer.getLatLng) {
                            const latlng = layer.getLatLng();
                            if (Math.abs(latlng.lat - restaurant.lat) < 0.0001 &&
                                Math.abs(latlng.lng - restaurant.lng) < 0.0001) {
                                targetMarker = layer;
                            }
                        }
                    });
                    if (targetMarker) {
                        map.setView([restaurant.lat, restaurant.lng], 14);
                        targetMarker.openPopup();
                    } else {
                        map.setView([restaurant.lat, restaurant.lng], 14);
                    }
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.remove('open');
                        document.getElementById('sidebarBackdrop').classList.remove('active');
                    }
                });
            });
        }

        // =============================================================
        // 13. 地區按鈕 (加入「其他」)
        // =============================================================

        function renderDistrictButtons() {
            const grid = document.getElementById('districtGrid');
            let html = '<div class="district-tag active" data-district="">全部</div>';
            // 18區
            DISTRICTS.forEach(d => {
                html += `<div class="district-tag" data-district="${d}">${d}</div>`;
            });
            // 新增「其他」
            html += `<div class="district-tag" data-district="other">其他</div>`;
            grid.innerHTML = html;

            grid.querySelectorAll('.district-tag').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    grid.querySelectorAll('.district-tag').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const val = this.dataset.district;
                    activeDistrict = val === '' ? null : val;
                    renderMarkers();
                });
            });
        }

        // =============================================================
        // 14. 價格 & 星級 & 品類篩選
        // =============================================================

        function setupFilters() {
            // 價格
            const priceContainer = document.getElementById('priceFilter');
            priceContainer.querySelectorAll('.filter-tag').forEach(el => {
                el.addEventListener('click', () => {
                    priceContainer.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    el.classList.add('active');
                    activePrice = el.dataset.price;
                    renderMarkers();
                });
            });

            // 星級
            const starContainer = document.getElementById('starFilter');
            starContainer.querySelectorAll('.filter-tag').forEach(el => {
                el.addEventListener('click', () => {
                    starContainer.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    el.classList.add('active');
                    activeStars = el.dataset.stars;
                    renderMarkers();
                });
            });

            // 品類 (動態生成)
            updateCuisineFilter();
        }

        function updateCuisineFilter() {
            const container = document.getElementById('cuisineFilter');
            // 取得所有非空 cuisine
            const cuisines = new Set();
            restaurants.forEach(r => {
                if (r.cuisine && r.cuisine.trim()) cuisines.add(r.cuisine.trim());
            });
            let html = `<span class="filter-tag cuisine active" data-cuisine="all">全部</span>`;
            cuisines.forEach(c => {
                html += `<span class="filter-tag cuisine" data-cuisine="${escapeHtml(c)}">${escapeHtml(c)}</span>`;
            });
            container.innerHTML = html;

            container.querySelectorAll('.filter-tag').forEach(el => {
                el.addEventListener('click', () => {
                    container.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    el.classList.add('active');
                    activeCuisine = el.dataset.cuisine;
                    renderMarkers();
                });
            });
        }

        // =============================================================
        // 15. 新增餐廳 (完整驗證，支援「其他」地區)
        // =============================================================

        function setupAddForm() {
            const modal = document.getElementById('addModal');
            const openBtn = document.getElementById('openAddBtn');
            const closeBtn = document.getElementById('closeAddBtn');
            const form = document.getElementById('addForm');
            const districtSelect = document.getElementById('fDistrict');
            const customDistrictGroup = document.getElementById('customDistrictGroup');
            const customDistrictInput = document.getElementById('fCustomDistrict');
            const pwdInput = document.getElementById('fPassword');
            const pwdError = document.getElementById('pwdError');

            // 填入地區選項 (18區 + 其他)
            const optOther = document.createElement('option');
            optOther.value = 'other';
            optOther.textContent = '其他 (自訂)';
            districtSelect.appendChild(optOther);
            DISTRICTS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                districtSelect.appendChild(opt);
            });

            // 當選擇「其他」時顯示自訂輸入框
            districtSelect.addEventListener('change', function() {
                if (this.value === 'other') {
                    customDistrictGroup.style.display = 'block';
                    customDistrictInput.focus();
                } else {
                    customDistrictGroup.style.display = 'none';
                }
            });

            openBtn.addEventListener('click', () => {
                modal.classList.add('open');
                if (activeDistrict && activeDistrict !== 'other') {
                    districtSelect.value = activeDistrict;
                } else {
                    districtSelect.value = '';
                }
                customDistrictGroup.style.display = 'none';
                document.getElementById('fName').focus();
                pwdInput.value = '';
                pwdError.classList.remove('show');
            });

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('open');
                form.reset();
                pwdError.classList.remove('show');
                pwdInput.value = '';
                customDistrictGroup.style.display = 'none';
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('open');
                    form.reset();
                    pwdError.classList.remove('show');
                    pwdInput.value = '';
                    customDistrictGroup.style.display = 'none';
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                // 密碼
                const password = pwdInput.value.trim();
                if (password !== STATIC_PASSWORD) {
                    pwdError.classList.add('show');
                    pwdInput.value = '';
                    pwdInput.focus();
                    return;
                } else {
                    pwdError.classList.remove('show');
                }

                // 獲取欄位
                const name = document.getElementById('fName').value.trim();
                let district = document.getElementById('fDistrict').value;
                const price = document.getElementById('fPrice').value;
                const rating = parseInt(document.getElementById('fRating').value);
                const cuisine = document.getElementById('fCuisine').value.trim();
                const location = document.getElementById('fLocation').value.trim();
                const phone = document.getElementById('fPhone').value.trim();
                const hours = document.getElementById('fHours').value.trim();
                const recommender = document.getElementById('fRecommender').value.trim();
                const image = document.getElementById('fImage').value.trim();
                const comment = document.getElementById('fComment').value.trim();

                // 處理「其他」地區
                if (district === 'other') {
                    const custom = customDistrictInput.value.trim();
                    if (!custom) {
                        alert('請輸入自訂地區名稱。');
                        customDistrictInput.focus();
                        return;
                    }
                    district = custom;
                } else if (!district) {
                    alert('請選擇地區。');
                    return;
                }

                // 型別與內容檢查
                if (!isValidName(name)) {
                    alert('餐廳名稱必須為 1~50 個字元。');
                    document.getElementById('fName').focus();
                    return;
                }
                // 地區不必再檢查是否在DISTRICTS，因為可能是自訂
                if (!['high', 'medium', 'low'].includes(price)) {
                    alert('價格等級錯誤。');
                    return;
                }
                if (![1, 2, 3].includes(rating)) {
                    alert('評分必須為 1、2 或 3。');
                    return;
                }
                if (!isValidLocation(location)) {
                    alert('地址必須填寫且不超過 200 字元。');
                    document.getElementById('fLocation').focus();
                    return;
                }
                if (!isValidPhone(phone)) {
                    alert('電話號碼格式不正確，請輸入有效的電話號碼。');
                    document.getElementById('fPhone').focus();
                    return;
                }
                if (!isValidUrl(image)) {
                    alert('圖片網址格式不正確，請輸入有效的 http/https 網址。');
                    document.getElementById('fImage').focus();
                    return;
                }
                if (cuisine.length > 30) {
                    alert('品類名稱請勿超過 30 個字元。');
                    document.getElementById('fCuisine').focus();
                    return;
                }
                if (hours.length > 30) {
                    alert('營業時間請勿超過 30 個字元。');
                    document.getElementById('fHours').focus();
                    return;
                }
                if (recommender.length > 30) {
                    alert('推薦者名稱請勿超過 30 個字元。');
                    document.getElementById('fRecommender').focus();
                    return;
                }
                if (comment.length > 500) {
                    alert('評論請勿超過 500 字元。');
                    document.getElementById('fComment').focus();
                    return;
                }

                // 經緯度生成 (若地區為自訂，使用香港中心加隨機偏移)
                let base;
                if (DISTRICTS.includes(district)) {
                    const baseCoords = {
                        '中西區': { lat: 22.285, lng: 114.155 },
                        '灣仔區': { lat: 22.278, lng: 114.178 },
                        '東區': { lat: 22.282, lng: 114.225 },
                        '南區': { lat: 22.248, lng: 114.153 },
                        '油尖旺區': { lat: 22.305, lng: 114.171 },
                        '深水埗區': { lat: 22.331, lng: 114.163 },
                        '九龍城區': { lat: 22.327, lng: 114.187 },
                        '黃大仙區': { lat: 22.342, lng: 114.196 },
                        '觀塘區': { lat: 22.315, lng: 114.226 },
                        '荃灣區': { lat: 22.370, lng: 114.114 },
                        '屯門區': { lat: 22.391, lng: 113.978 },
                        '元朗區': { lat: 22.443, lng: 114.022 },
                        '北區': { lat: 22.495, lng: 114.138 },
                        '大埔區': { lat: 22.453, lng: 114.163 },
                        '沙田區': { lat: 22.383, lng: 114.192 },
                        '西貢區': { lat: 22.381, lng: 114.275 },
                        '離島區': { lat: 22.261, lng: 113.946 },
                        '葵青區': { lat: 22.364, lng: 114.132 }
                    };
                    base = baseCoords[district];
                } else {
                    // 自訂地區使用香港中心
                    base = { lat: 22.3193, lng: 114.1694 };
                }
                const lat = base.lat + (Math.random() - 0.5) * 0.008;
                const lng = base.lng + (Math.random() - 0.5) * 0.008;

                const newRestaurant = {
                    id: 'r' + (nextId++),
                    name,
                    district,
                    price,
                    rating,
                    cuisine,
                    location,
                    phone,
                    hours,
                    recommender,
                    image,
                    comment,
                    lat,
                    lng
                };

                restaurants.push(newRestaurant);
                saveRestaurants(restaurants);
                renderMarkers();
                // 更新品類篩選器 (因可能新增新菜系)
                updateCuisineFilter();

                modal.classList.remove('open');
                form.reset();
                pwdError.classList.remove('show');
                pwdInput.value = '';
                customDistrictGroup.style.display = 'none';

                // 自動切換到該地區 (若為自訂則切換到「其他」)
                if (DISTRICTS.includes(district)) {
                    activeDistrict = district;
                    document.querySelectorAll('.district-tag').forEach(el => {
                        el.classList.toggle('active', el.dataset.district === district);
                    });
                } else {
                    activeDistrict = 'other';
                    document.querySelectorAll('.district-tag').forEach(el => {
                        el.classList.toggle('active', el.dataset.district === 'other');
                    });
                }
                renderMarkers();

                const btn = form.querySelector('button[type="submit"]');
                const orig = btn.textContent;
                btn.textContent = '✅ 已新增！';
                setTimeout(() => { btn.textContent = orig; }, 1500);
            });
        }

        // =============================================================
        // 16. 啟動
        // =============================================================

        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            renderDistrictButtons();
            setupFilters();
            setupAddForm();

            console.log('🍜 食在地圖已啟動 (Leaflet + OSM)');
            console.log('📌 新增餐廳密碼:', STATIC_PASSWORD);
            console.log('💾 資料儲存於 localStorage');
            console.log('🏙️ 共 ' + restaurants.length + ' 間餐廳 (3星制)');
        });
    </script>

</body>
</html>
